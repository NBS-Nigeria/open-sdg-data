page_content: |-
  <strong>Non-statistical indicator</strong>
    <br><br>
    We have identified the following to be relevant for reporting on this indicator:
    <br><br>
    <a href="https://www.nema.gov.ng/national-disaster-management-frame-work/2/">Nigeria's Framework for Disaster Management</a> mandates the establishment of Disaster Management structures at all levels of governance (federal, states and local) in Nigeria. 
    <br><br>
    The <a href="https://nema.gov.ng/the-national-disaster-response-plan/">Disaster Response Plan for Nigeria</a> established a process and structure for the systematic, coordinated and effective delivery of Federal Assistance, to address the consequences of any major disaster or emergency declared by the President of the Federal Republic of Nigeria.
    <br><br>
    <a href="https://nema.gov.ng/documentations/National%20Contingency%20Plan%20(2019-2021)%20-%20Revised.pdf">National Contigency Plan</a> The document adopts the multi-risk approach and aims to reduce impact of disasters and save as many lives as possible from preventable causes.
        <br><br>
    <a href="https://nema.gov.ng/documentations/National%20Disaster%20Risk%20Management%20Policy.pdf">National Disaster Risk Management Policy</a> he goal of the Policy is to institutionalize development and application of disaster risk management systems, mechanisms, practices and programmes aimed at effectively reducing hazard risk as a means of ensuring resilience to disasters within the context of sustainable development at the Federal, State and Local Government levels of the national territory.
    <br><br>
    <table><tr><td>Availability of National Disaster Risk Reduction Strategy in Line with Sendai Framework</td><td>2016</td><td>2017</td><td>2018</td><td>2019</td><td>2020</td><td>2021</td><td>2022</td><td>2023</td></tr><tr><td>Unit - Yes =1     No=2</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>
