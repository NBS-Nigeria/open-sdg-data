    <table><thead><tr><th>Indicator</th><th>Progress Report</th></tr></thead><tbody><tr><td>Nigeria progress in the implementation of international instruments aiming to combat illegal, unreported and unregulated fishing</td><td>Nigeria became a party to the Agreement on Port State Measures (PSMA) in October 2022, making it the 27th African country to do so. The PSMA is an international agreement that aims to prevent, deter, and eliminate illegal, unreported, and unregulated (IUU) fishing. Establishment of Vessel Monitoring System (VMS) in Lagos and Abuja to monitor and control illegal, unreported and unregulated fishing along Nigeria’s continental shelf.</td></tr></tbody></table>
