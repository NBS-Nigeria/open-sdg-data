page_content: |-
  <strong>Non-statistical indicator</strong>
    <br><br>
    We have identified the following to be relevant for reporting on this indicator:
    <br><br>
    <table><tr><td>Does Nigeria have systems to track and make public allocations for gender equality and women&#39;s empowerment?</td><td colspan="9">Yes, Nigeria has systems to track and make public allocations for gender equality and women&#39;s empowerment, though the effectiveness of these systems has varied over the years due to challenges in implementation, transparency, and consistency</td></tr>
    <tr><td>If yes, what systems are in place to track and make public allocations for gender equality and women&#39;s empowerment?</td>
    <td>i) Gender-Responsive Budgeting(GRB): The FMWA and Her Parastatal MBNCWD began integrating GRB into their financial plans. <br> ii) National Gender Policy (NGP): The NGP emphasize budgetary commitments to gender equality, but systematic tracking mechanisms were still weak.</td>
    <td>Increased Advocacy: Advocacy for GRB gained momentum, leading to some improvements in budget proposals from MDAs.</td>
    <td>National Economic Recovery and Growth Plan (ERGP, 2017-2020): Gender equality and women&#39;s empowerment were highlighted as priorities, though specific tracking systems were still underdeveloped.</td>
    <td>Development of Gender-Specific Programs: Increased focus on gender-specific initiatives like economic empowerment for women entrepreneurs.</td>
    <td>i) COVID-19 Response and GRB: The pandemic underscored the need for gender-sensitive budgeting, leading to targeted allocations for women&#39;s economic recovery. <br> ii) National Gender Policy Review: Calls for a review of the NGP included demands for improved tracking of budgetary commitments.</td>
    <td>i) National Gender Policy Review (Draft): Efforts to revise the NGP included frameworks for better financial tracking and public reporting on allocations <br> ii)GRB Advocacy Increased collaboration between government and international partners to expand GRB practices nationwide.</td>
    <td>National Development Plan (2021-2025): This plan included gender-responsive goals, with explicit budgetary allocations for women&#39;s empowerment.</td>
    <td>Election Year Focus: Funding for gender equality programs related to Political participation increased though tracking remained inconsistent.</td>
    <td>Rehabilitation of the National Gender Databank: This ongoing initiative aimed to provide real-time data on gender-disaggregated allocations.</td></tr></table>
