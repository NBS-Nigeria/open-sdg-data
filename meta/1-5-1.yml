STAT_CONC_DEF: >-
  Death: The number of people who died  during the disaster, or directly after,
  as a direct result of the hazardous event

  Missing: The number of people whose whereabouts is unknown since the hazardous
  event. It includes people who are  presumed dead although there is no physical
  evidence. The data on number of deaths and number of missing are mutually
  exclusive.   

  Affected people:  People who are affected by a hazardous event
