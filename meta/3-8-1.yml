SDG_INDICATOR__GLOBAL: '<p>Indicator 3.8.1: Coverage of essential health services </p>'
SDG_TARGET__GLOBAL: >-
  <p>Target 3.8: Achieve universal health coverage, including financial risk
  protection, access to quality essential health-care services and access to
  safe, effective, quality and affordable essential medicines and vaccines for
  all</p>
META_LAST_UPDATE__GLOBAL: '2023-12-15'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>World Health Organization (WHO) </p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>The universal health coverage (UHC) service coverage index is designed to
  summarize existing indicators of health service coverage to ensure consistency
  with the SDGs and other global initiatives and reduce duplication and
  reporting burden. </p>

  <p>Indicator 3.8.1 should always be interpreted together with the other SDG
  UHC indicator, 3.8.2, which measures financial protection.</p>
SDG_INDICATOR_INFO: >-
  <b>Proxy:</b> Percentage of children who have received all vaccinations
  recommended in the national immunization schedule
