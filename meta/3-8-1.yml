STAT_CONC_DEF: >-
  Tracer interventions for promotion and prevention services include: family
  planning coverage (need satisfied), antenatal care (at least four visits),
  vaccination, non-use of tobacco, improved water source, adequate sanitation
  and other locally relevant coverage indicators. Tracer interventions for
  treatment services include: skilled birth attendance, antiretroviral therapy,
  tuberculosis treatment (case detection and treatment success), hypertension
  treatment, diabetes treatment, pneumonia treatment in children and other
  locally relevant indicators.
