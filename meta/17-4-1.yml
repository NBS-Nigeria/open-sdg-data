SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 17.4.1: Debt service as a proportion of exports of goods,
  services and primary income<sup><a href="#footnote-2"
  id="footnote-ref-2">[1]</a></sup></p><div class="footnotes"><div><sup
  class="footnote-number" id="footnote-2">1</sup><p> Refinement of the indicator
  name approved by the IAEG-SDGs in its 15th meeting and pending final approval
  by the 56th session of the Statistical Commission in March 2025. <a
  href="#footnote-ref-2">&#x2191;</a></p></div></div>
SDG_TARGET__GLOBAL: >-
  <p>Target 17.4: Assist developing countries in attaining long-term debt
  sustainability through coordinated policies aimed at fostering debt financing,
  debt relief and debt restructuring, as appropriate, and address the external
  debt of highly indebted poor countries to reduce debt distress</p>
