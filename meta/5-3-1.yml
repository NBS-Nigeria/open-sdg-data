SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 5.3.1: Proportion of women aged 20&#x2013;24 years who were
  married or in a union before age 15 and before age 18</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 5.3: Eliminate all harmful practices, such as child, early and
  forced marriage and female genital mutilation</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>United Nations Children&apos;s Fund (UNICEF)</p>
SDG_RELATED_INDICATORS__GLOBAL: <p>Not applicable</p>
SDG_INDICATOR_INFO: >-
  <b>Proxy: </b> Percentage of women age 15-49 years who first married or
  entered a marital union before their 15th birthday, Percentage of women age
  20-49 and 20-24 years who first married or entered a marital union before
  their 15th and 18th birthdays, Percentage of women age 15-19 years who
  currently married or in a union, and the percentage of women who are in a
  polygamous marriage or union.
