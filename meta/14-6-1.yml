SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 14.6.1: Degree of implementation of international instruments
  aiming to combat illegal, unreported and unregulated fishing</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 14.6: By 2020, prohibit certain forms of fisheries subsidies which
  contribute to overcapacity and overfishing, eliminate subsidies that
  contribute to illegal, unreported and unregulated fishing and refrain from
  introducing new such subsidies, recognizing that appropriate and effective
  special and differential treatment for developing and least developed
  countries should be an integral part of the World Trade Organization fisheries
  subsidies negotiation</p>
