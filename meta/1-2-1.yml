STAT_CONC_DEF: >- 
  This indicator provides the proportion of the total population and the proportion 
  of the employed population living in households with per-capita consumption or income 
  that is below the national poverty line. It is calculated by dividing the number of 
  persons living in households below the poverty line (disaggregated by sex, age and employment status) 
  by the total number of persons (disaggregated by the same sex, age and employment status groups).

UNIT_MEASURE: >-
  Percent (%). The unit of measures is the proportion of the population.

