STAT_CONC_DEF: >
  Illicit financial flows (IFFs) are commonly defined as the transferred monies
  that is earned, transferred or utilized through illicit means, into or out of
  a country. They include legally earned value, money and monetized instruments
  that are transferred illicitly or value, money and monetized instruments that
  are acquired through illegal activities, such as the proceeds of crimes,
  including corruption and tax evasion. They can also capture tax avoidance and
  trade misinvoicing
