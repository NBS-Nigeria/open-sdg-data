STAT_CONC_DEF: >-
  Output overtime of a given major sector per volume of (net) water withdrawn
  (showing the trend in water use efficiency). Following ISIC.4 coding, sectors
  are defined as agriculture and fishing (ISIC 4-A); manufacturing,
  constructions, mining and quarrying (ISIC 4-B, 4-C, and 4-F); electricity
  industry (ISIC 4-D); and the municipal sector (ISIC 4-E).
