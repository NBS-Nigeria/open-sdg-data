STAT_CONC_DEF: >
  This indicator is computed as the number of persons employed in the industry
  sector divided by total employment. Employed persons are defined as all those
  of working age who, during a short reference period, were engaged in any
  activity to produce goods or provide services for pay or profit. The industry
  sector comprises mining and quarrying, manufacturing, construction and public
  utilities (electricity, gas and water)
