STAT_CONC_DEF: >-
  The renewable energy share in total final consumption is the percentage of
  final consumption of energy that is derived from renewable resources. It is
  calculated by dividing consumption of energy from all renewable sources by
  total final energy consumption. renewable energy consumption includes
  consumption of energy derived from: hydro, solid biofuels, biogas, geothermal,
  marine and waste. Total final energy consumption minus non-energy use.
