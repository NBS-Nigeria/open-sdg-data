STAT_CONC_DEF: >-
  This indicator is defined as the 'proportion of individuals who own a mobile
  telephone, by sex'. An individual owns a mobile cellular phone if he.she has a
  mobile phone device with at least one active SIM card for personal use. Mobile
  cellular phones supplied by employers that can be used for personal reasons
  (to make personal calls, access the internet, etc.) are included. 
