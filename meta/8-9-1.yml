STAT_CONC_DEF: >
  (a) Tourism Direct GDP  (TDGDP) (as % total GDP and in growth rate) is defined
  as the sum of the part of gross value added (at basic prices) generated by all
  industries in response to internal tourism consumption plus the amount of net
  taxes on products and imports included within the value of this expenditure at
  purchasers' prices.  Shows relative size of the tourism sector in the economy.
