STAT_CONC_DEF: >
  The term child labour reflects the engagement of children in prohibited work
  and, more generally, in types of work to be eliminated as socially and morally
  undesirable as guided by national legislation, the ILO Minimum Age Convention,
  1973 (No. 138), and the Worst Forms of Child Lobour Convention, 1999 (No.
  182), their respective supplementing Recommendations (Nos 146 and 190), and
  the United Nations Convention on the Rights of the Child.
