SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 17.7.1: Total amount of funding for developing and developed
  countries to promote the development, transfer, dissemination and diffusion of
  environmentally sound technologies<sup><a href="#footnote-2"
  id="footnote-ref-2">[1]</a></sup></p><div class="footnotes"><div><sup
  class="footnote-number" id="footnote-2">1</sup><p> Refinement of the indicator
  name approved by the IAEG-SDGs in its 15th meeting and pending final approval
  by the 56th session of the Statistical Commission in March 2025. <a
  href="#footnote-ref-2">&#x2191;</a></p></div></div>
SDG_TARGET__GLOBAL: >-
  <p>Target 17.7: Promote the development, transfer, dissemination and diffusion
  of environmentally sound technologies to developing countries on favourable
  terms, including on concessional and preferential terms, as mutually
  agreed</p>
META_LAST_UPDATE__GLOBAL: '2024-12-20'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>United Nations Environment Programme (UNEP)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>United Nations Environment Programme (UNEP) has identified a number of SDGs
  where uptake of Environmentally Sound Technologies (ESTs) contributes to their
  achievement: Goal 7 on ensuring access to affordable, reliable, sustainable
  and modern energy for all; Goal 8 on the promotion of sustained, inclusive and
  sustainable economic growth, full and productive employment and decent work
  for all; Goal 12 on sustainable consumption and production patterns, and Goal
  13 on taking urgent action to combat climate change and its impacts.</p>
