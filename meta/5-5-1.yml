STAT_CONC_DEF: >-
  Womens' proportional representation in two district areas of government: (i)
  national parliaments; (ii) local government    (1) In the case of women in
  national parliaments, the indicator covers the single chamber in unicameral
  parliaments and the lower chamber in bicameral parliaments. It does not cover
  the upper chamber of bicameral parliaments. (2) With respect to women in local
  government, the indicator refers to the proportion of women holding leadership
  positions in lower (i.e. sub-national) levels of government. 
