SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 14.c.1: Number of countries making progress in ratifying,
  accepting and implementing through legal, policy and institutional frameworks,
  ocean-related instruments that implement international law, as reflected in
  the United Nations Convention on the Law of the Sea, for the conservation and
  sustainable use of the oceans and their resources</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 14.c: Enhance the conservation and sustainable use of oceans and
  their resources by implementing international law as reflected in the United
  Nations Convention on the Law of the Sea, which provides the legal framework
  for the conservation and sustainable use of oceans and their resources, as
  recalled in paragraph 158 of &#x201C;The future we want&#x201D;</p>
META_LAST_UPDATE__GLOBAL: '2024-12-20'
SDG_CUSTODIAN_AGENCIES__GLOBAL: >-
  <p>Division for Ocean Affairs and the Law of the Sea (DOALOS), Office of Legal
  Affairs (OLA), United Nations Secretariat</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>Implementation of target 14.c is linked to progress in all other targets of
  Sustainable Development Goal 14, and the other ocean-related Goals of the 2030
  Agenda.</p>
