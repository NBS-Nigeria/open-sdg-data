SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 16.7.2: Proportion of population who believe decision-making is
  inclusive and responsive, by sex, age, disability and population group</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 16.7: Ensure responsive, inclusive, participatory and representative
  decision-making at all levels</p>
META_LAST_UPDATE__GLOBAL: '2023-03-31'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>UNDP Oslo Governance Centre</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>SDG indicator 16.7.2 complements indicator <strong>16.7.1</strong> (under
  the same target 16.7 -- &#x201C;Ensure responsive, inclusive, participatory
  and representative decision-making at all levels&#x201D;) which draws on
  administrative data sources to measure the proportional representation of
  various population groups in public institutions. The two indicators are
  highly complementary as proportional representation alone is no guarantee that
  all population groups represented in public institutions have equal
  decision-making power, or that all population groups in the national
  population have equal opportunities to voice their interests and preferences
  and to influence public decision-making. Indicator 16.7.2 provides important
  additional information by focusing on the inclusiveness and responsiveness of
  decision-making, as perceived by the population (drawing from population
  surveys).</p>

  <p>Indicator 16.7.2 can also be used to complement SDG target 10.2 on the
  promotion of the &#x201C;social, economic and political inclusion of all,
  irrespective of age, sex, disability, race, ethnicity, origin, religion or
  economic or other status&#x201D;, which only has one indicator measuring
  economic exclusion (<strong>SDG 10.2.1</strong> &#x2013; Proportion of people
  living below 50 per cent of median income, by age, sex and persons with
  disabilities). Indicator 16.7.2 therefore provides important additional
  information to measure progress against this target by providing data on
  <em>political</em> inclusion. </p>

  <p>Similarly, 16.7.2 can also be used to complement SDG target 10.3 on
  &#x201C;Ensuring equal opportunity and reduce inequalities of outcome,
  including by eliminating discriminatory laws, policies and practices and
  promoting appropriate legislation, policies and action in this regard&#x201D;,
  which only has one indicator measuring felt discrimination on various grounds
  (<strong>SDG 10.3.1</strong> Proportion of the population reporting having
  personally felt discriminated against or harassed within the previous 12
  months on the basis of a ground of discrimination prohibited under
  international human rights law). Indicator 16.7.2 therefore provides relevant
  additional information to measure progress against this target by helping to
  identify whether certain population groups might feel discriminated against in
  terms of their inclusion in public decision-making and the extent to which
  political institutions are responsive to their demands/preferences.</p>
