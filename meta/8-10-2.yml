STAT_CONC_DEF: >
  Denotes the percentage of respondents who report having an account (by
  themselves or together with someone else) at a bank or another type of
  financial institution; having a debit card in their own name; receiving wages,
  government transfers, or payments for agricultural products into an account or
  through a mobile phone at a financial institution in the past 12 months;
  paying utility bills or school fees from an account at a financial institution
  in the past 12 months; receiving wages or government transfers into a card in
  the past 12 months; or personally using a mobile phone to pay bills or to send
  or receive money through a GSM Association (GSMA) Mobile Money for Unbanked
  (MMU) service in the past 12 months (% age 15 and above)
