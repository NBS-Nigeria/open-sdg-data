SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 2.1.2: Prevalence of moderate or severe food insecurity in the
  population, based on the Food Insecurity Experience Scale (FIES)</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 2.1: By 2030, end hunger and ensure access by all people, in
  particular the poor and people in vulnerable situations, including infants, to
  safe, nutritious and sufficient food all year round</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>Food and Agriculture Organisation of the United Nations (FAO)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>2.1.1, 2.2.1, 2.2.2, 2.2.3</p>

  <p>Comments: </p>

  <p>Links with Target 2.2, to the extent that hunger may lead to malnutrition,
  and Target 2.2 may not be achieved if Target 2.1 is not achieved.</p>
