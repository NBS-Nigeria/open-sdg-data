  The percentage of individuals in the national adult population (15 or more
  years of age) that have experienced moderate or severe levels of food
  insecurity respectively, during the previous year. Severity of food is defined
  as the extent to which people have difficulties in accessing food of adequate
  quality and/or quantity due to lack of money or other resources
