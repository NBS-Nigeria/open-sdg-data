SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 5.6.1: Proportion of women aged 15&#x2013;49 years who make their
  own informed decisions regarding sexual relations, contraceptive use and
  reproductive health care</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 5.6: Ensure universal access to sexual and reproductive health and
  reproductive rights as agreed in accordance with the Programme of Action of
  the International Conference on Population and Development and the Beijing
  Platform for Action and the outcome documents of their review conferences</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>United Nations Population Fund (UNFPA)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>Indicator 3.1.1: Maternal mortality ratio</p>

  <p>Indicator 3.1.2: Proportion of births attended by skilled health
  personnel</p>

  <p>Indicator 3.7.1: Proportion of women of reproductive age (aged 15&#x2013;49
  years) who have their need for family planning satisfied with modern
  methods</p>

  <p>Indicator 3.7.2: Adolescent birth rate (aged 10&#x2013;14 years; aged
  15&#x2013;19 years) per 1,000 women in that age group</p>

  <p>Indicator 5.2.1: Proportion of ever-partnered women and girls aged 15 years
  and older subjected to physical, sexual or psychological violence by a current
  or former intimate partner in the previous 12 months, by form of violence and
  by age</p>

  <p>Indicator 5.6.2: Number of countries with laws and regulations that
  guarantee full and equal access to women and men aged 15 years and older to
  sexual and reproductive health care, information and education</p>
SDG_INDICATOR_INFO: >-
  <b>Proxy: </b> Among currently married women age 15-49 who are current users
  of family planning, percent distribution by who makes the decision to use
  family planning, and among currently married women who are not currently using
  family planning, percent distribution by who makes the decision not to use
  family planning, according to background characteristics
