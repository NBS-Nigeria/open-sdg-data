SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 4.7.1: Extent to which (i) global citizenship education and (ii)
  education for sustainable development are mainstreamed in (a) national
  education policies; (b) curricula; (c) teacher education; and (d) student
  assessment</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 4.7: By 2030, ensure that all learners acquire the knowledge and
  skills needed to promote sustainable development, including, among others,
  through education for sustainable development and sustainable lifestyles,
  human rights, gender equality, promotion of a culture of peace and
  non-violence, global citizenship and appreciation of cultural diversity and of
  culture&#x2019;s contribution to sustainable development</p>
META_LAST_UPDATE__GLOBAL: '2024-03-28'
SDG_CUSTODIAN_AGENCIES__GLOBAL: >-
  <p>UNESCO Education Sector, Division for Peace and Sustainable Development,
  Section of Education for Sustainable Development (UNESCO-ED/PSD/ESD)</p>

  <p>UNESCO Institute for Statistics (UNESCO-UIS)</p>
SDG_RELATED_INDICATORS__GLOBAL: <p>12.8.1 and 13.3.1</p>
