STAT_CONC_DEF: >-
  "The indicator proposed measure the proportion of women in leadership
  positions across a number of areas, including:                   

  • in the executive branch of government:  

  o  Number of women Heads of State and Governments as a percentage of total
  (Tier 1) 

  o  Number of ministerial positions that are held by women as a percentage of
  total (Tier 1 – part of Minimum set of gender indicators) 

  o  Number of leadership positions held by women in local governments as a
  percentage of total (Tier 3) 

  •  in the legislative branch of government: 

  o  Number of seats in national parliaments held by women as a percentage of
  total (Tier 1 – part of Minimum set of gender indicators) 

  • in the judiciary branch of government and law enforcement:

  o  Number of women judges as a percentage of total (Tier 2 - – part of Minimum
  set of gender indicators) 

  o  Number of women police officers as a percentage of total (Tier 2 – part of
  Minimum set of gender indicators) ; and 

  o  the share of managers in public and private sector enterprises that are
  women (Tier 1 – part of Minimum set of gender indicators)."
