SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 3.b.3: Proportion of health facilities that have a core set of
  relevant essential medicines available and affordable on a sustainable basis
  </p>
SDG_TARGET__GLOBAL: >-
  <p>Target 3.b: Support the research and development of vaccines and medicines
  for the communicable and non&#x2011;communicable diseases that primarily
  affect developing countries, provide access to affordable essential medicines
  and vaccines, in accordance with the Doha Declaration on the TRIPS Agreement
  and Public Health, which affirms the right of developing countries to use to
  the full the provisions in the Agreement on Trade-Related Aspects of
  Intellectual Property Rights regarding flexibilities to protect public health,
  and, in particular, provide access to medicines for all</p>
META_LAST_UPDATE__GLOBAL: <p>2019-01-01</p>
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>World Health Organization (WHO)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>3.b.1- Proportion of the target population covered by all vaccines included
  in their national programme</p>

  <p>3.b.2- Total net official development assistance to medical research and
  basic health sectors</p>

  <p>3.8.1-Coverage of essential health services (defined as the average
  coverage of essential services based on tracer interventions that include
  reproductive, maternal, new born and child health, infectious diseases,
  non-communicable diseases and service capacity and access, among the general
  and the most disadvantaged population)</p>

  <p>3.8.2-Proportion of population with large household expenditures on health
  as a share of total household expenditure or income</p>
