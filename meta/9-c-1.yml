STAT_CONC_DEF: >
  The indicator percentage of the population covered by a mobile network, broken
  down by technology, refers to the percentage of inhabitants living within
  range of a mobile-cellulaar signal, irrespective of whether or not they are
  mobile phone subscribers or users. This is calculated by dividing the number
  of inhabitants within range of a mobile-cellular signal by the total
  population and multiplying by 100.
