SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 6.5.2: Proportion of transboundary basin area with an operational
  arrangement for water cooperation</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 6.5: By 2030, implement integrated water resources management at all
  levels, including through transboundary cooperation as appropriate</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: >-
  <p>Intergovernmental Hydrological Programme of United Nations Educational,
  Scientific and Cultural Organization (UNESCO-IHP)</p>

  <p>United Nations Economic Commission for Europe (UNECE)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>SDG indicator 6.5.2 provides a complement to SDG indicator 6.5.1 which
  measures the advancement of Integrated Water Resources Management (IWRM) at
  all levels. </p>

  <p>In addition, as the only indicator in the 2030 Agenda for Sustainable
  Development explicitly referring to transboundary cooperation, indicator 6.5.2
  can play a catalytic role across multiple SDGs and targets including:</p>

  <p>SDG 1 &#x2013; No Poverty </p>

  <p>- Indicator 1.1.1 Proportion of population below the international poverty
  line, by sex, age, employment status and geographical location
  (urban/rural)</p>

  <p>- Indicator 1.4.1 Proportion of population living in households with access
  to basic services </p>

  <p>SDG 2 &#x2013; Zero Hunger</p>

  <p>- Indicator 2.4.1 Proportion of agricultural area under productive and
  sustainable agriculture</p>

  <p>SDG 3 &#x2013; Good Health and Well-being</p>

  <p>- Indicator 3.9.2 Mortality rate attributed to unsafe water, unsafe
  sanitation and lack of hygiene (exposure to unsafe Water, Sanitation and
  Hygiene for All (WASH) services)</p>

  <p>SDG 4 &#x2013; Quality Education</p>

  <p>- Indicator 4.7.1 Extent to which (i) global citizenship education and (ii)
  education for sustainable development, including gender equality and human
  rights, are mainstreamed at all levels in: (a) national education policies,
  (b) curricula, (c) teacher education and (d) student assessment</p>

  <p>SDG 5 &#x2013; Gender Equality </p>

  <p>- Indicator 5.5.2 Proportion of women in managerial positions</p>

  <p>SDG 7 &#x2013; Affordable and Clean Energy </p>

  <p>- Indicator 7.1.2 Proportion of population with primary reliance on clean
  fuels and technology </p>

  <p>- Indicator 7.2.1 Renewable energy share in the total final energy
  consumption </p>

  <p>SDG 11 &#x2013; Sustainable Cities and Communities</p>

  <p>- Indicator 11.5.2 Direct disaster economic loss in relation to global GDP,
  including disaster damage to critical infrastructure and disruption of basic
  services </p>

  <p>SDG 13 &#x2013; Climate Action</p>

  <p>- Indicator 13.3.2 Number of countries that have communicated the
  strengthening of institutional, systemic and individual capacity-building to
  implement adaptation, mitigation and technology transfer, and development
  actions</p>

  <p>SDG 14 &#x2013; Life below Water</p>

  <p>- Indicator 14.1.1 Index of coastal eutrophication and floating plastic
  debris density </p>

  <p>- Indicator 14.2.1 Proportion of national exclusive zones managed using
  ecosystem-based approaches </p>

  <p>SDG 15 &#x2013; Life on Land </p>

  <p>- Indicator 15.1.2 Proportion of important sites for terrestrial and
  freshwater biodiversity that are covered by protected areas, by ecosystem
  type</p>

  <p>- Indicator 15.2.1 Progress towards sustainable forest management </p>

  <p>SDG 16 &#x2013; Peace, Justice and Strong Institutions </p>

  <p>- Indicator 16.1.2 Conflict-related deaths per 100,000 population, by sex,
  age and cause </p>

  <p>- Indicator 16.7.2 Proportion of population who believe decision-making is
  inclusive and responsive, by sex, age, disability and population group </p>

  <p>SDG 17 &#x2013; Partnerships for the Goals </p>

  <p>- Indicator 17.9.1 Dollar value of financial and technical assistance
  (including through North-South, South-South and triangular cooperation)
  committed to developing countries</p>

  <p>- Indicator 17.14.1 Number of countries with mechanisms in place to enhance
  policy coherence of sustainable development</p>
