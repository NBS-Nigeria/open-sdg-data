SDG_INDICATOR__GLOBAL: '<p>Indicator 10.5.1: Financial Soundness Indicators</p>'
SDG_TARGET__GLOBAL: >-
  <p>Target 10.5: Improve the regulation and monitoring of global financial
  markets and institutions and strengthen the implementation of such
  regulations</p>
META_LAST_UPDATE__GLOBAL: '2024-09-27'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>International Monetary Fund (IMF)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>Linkages with any other Goals and Targets: Recommendation II.2 of G-20 Data
  Gap Initiative &#x2013; 2 concerned Financial Soundness Indicators (FSIs). The
  G-20 economies were asked to report the seven FSIs required from Special Data
  Dissemination Standards Plus (SDDS Plus) adherent economies on a quarterly
  frequency, with a timeliness of one quarter. These are the same FSIs as
  covered by this SDG Indicator 10.5.1 except that the SDG indicator includes
  the FSI net open position in foreign exchange to capital instead of the
  residential real estate prices. The G-20 economies were also asked to
  voluntarily initiate regular collection of Concentration and Distribution
  Measures, depending on the results of their cost-benefit analysis and national
  priorities. The implementation of the two FSI-related recommendations was
  concluded at end-2021.</p>
SDG_INDICATOR_INFO: >
  <b>Proxy: </b> i) Bank non performing loans to total gross loans(%) , ii)
  capital Adequacy Ratio, iii) Liquid assets to total assets, iv) Liquid assets
  to short term liabilities
