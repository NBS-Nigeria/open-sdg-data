SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 1.4.2: Proportion of total adult population with secure tenure
  rights to land, (a) with legally recognized documentation, and (b) who
  perceive their rights to land as secure, by sex and type of tenure</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 1.4: By 2030, ensure that all men and women, in particular the poor
  and the vulnerable, have equal rights to economic resources, as well as access
  to basic services, ownership and control over land and other forms of
  property, inheritance, natural resources, appropriate new technology and
  financial services, including microfinance</p>
META_LAST_UPDATE__GLOBAL: '2024-09-27'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>UN-Habitat and World Bank</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>This indicator is Goal 1, and is also particularly related to Goal 5, 5.a.1
  (access to agricultural land) and 5.a.2 (legal framework for land governance).
  Tenure security also matters for Goal 2, Target 2.3 (2.3.1 and 2.3.2
  addressing smallholder farmers; Target 2.4 (2.4.1 on agricultural area), to
  Goal 11, to indicator 11.1.1 (access to affordable housing/upgrading slums)
  and indicator 11.3.1 (sustainable urbanization/settlement planning). Land
  tenure also influences access to fisheries and is thus key to achieving Goal
  14, indicator 14.b.1 to provide access to small-scale fishers and marine
  resources, and to Goal 15 on the sustainable use of land and natural resources
  (indicator 15.1.1 on forest area). Similarly, land is a significant source of
  conflict, and thus also matters for Goal 16 for promoting peace and inclusive
  societies and institutions (indicator 16.3.3 on dispute resolution
  mechanisms).</p>
