STAT_CONC_DEF: >-
  The legal framework includes special measures to guarantee women's equal
  rights to land ownership and control.  The indicator monitors reforms that
  given women equal rights to economic resources as well as access to ownership
  and control over land. More specifically, the indicator allows for monitoring
  progress towards gender equity through the adoption of women-specific measures
  to promote women's security rights to land.
