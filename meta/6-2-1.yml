  Population using a basic sanitation facilityat the household level ('improved'
  sanitation facilities used for SDGs monitoring i.e. flush or pour flush
  toilets to sewer systems, septic tanks or pit laterines, ventilated improved
  pit laterines, pit laterines with a slab, and composting toilets, the same
  categories as improved sources of drinking water used for MDG monitoring)
  which is not shared with other households and where excreta is safely disposed
  in situ or treated off-site.
