SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 16.7.1: Proportions of positions in national and local
  institutions, including (a) the legislatures; (b) the public service; and (c)
  the judiciary, compared to national distributions, by sex, age, persons with
  disabilities and population groups</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 16.7: Ensure responsive, inclusive, participatory and representative
  decision-making at all levels</p>
META_LAST_UPDATE__GLOBAL: '2022-03-31'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>UNDP Oslo Governance Centre</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>This indicator can also be used to monitor SDG target 5.5 on women&#x2019;s
  &#x201C;full and effective participation and equal opportunities for
  leadership at all levels of decision-making in political, economic and public
  life,&#x201D;<sup><a href="#footnote-2" id="footnote-ref-2">[1]</a></sup>
  which does not have an indicator specifically focused on decision-making in
  the judiciary, and SDG target 10.2 on the promotion of the &#x201C;social,
  economic and political inclusion of all, irrespective of sex, age, disability,
  race, ethnicity, origin, religion or economic or other status&#x201D;, which
  only has one indicator measuring economic exclusion.<sup><a href="#footnote-3"
  id="footnote-ref-3">[2]</a></sup></p><div class="footnotes"><div><sup
  class="footnote-number" id="footnote-2">1</sup><p> SDG 5.5.1 <strong>&#x2013;
  </strong>Proportion of seats held by women in national parliaments and local
  governments; and SDG 5.5.2<strong> </strong>&#x2013; Proportion of women in
  managerial positions. <a
  href="#footnote-ref-2">&#x2191;</a></p></div><div><sup class="footnote-number"
  id="footnote-3">2</sup><p> SDG 10.2.1 &#x2013; Proportion of people living
  below 50% of median income, by sex, age, and persons with disabilities. <a
  href="#footnote-ref-3">&#x2191;</a></p></div></div>
