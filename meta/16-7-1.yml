STAT_CONC_DEF: >
  This indicator focuses on the representativeness aspect of the target, but the
  presence of diversity also conduces to inclusivity and responsiveness of
  decision-making.    The indicator is calculated as the number of public
  service positions held by members of the target group divided by the total
  number of such positions
