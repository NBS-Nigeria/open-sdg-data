SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 15.9.1: (a) Number of countries that have established national
  targets in accordance with or similar to Aichi Biodiversity Target 2 of the
  Strategic Plan for Biodiversity 2011&#x2013;2020 in their national
  biodiversity strategy and action plans and the progress reported towards these
  targets; and (b) integration of biodiversity into national accounting and
  reporting systems, defined as implementation of the System of
  Environmental-Economic Accounting</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 15.9: By 2020, integrate ecosystem and biodiversity values into
  national and local planning, development processes, poverty reduction
  strategies and accounts</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: >-
  <p>United Nations Environment Programme (UNEP), Convention on Biological
  Diversity (CBD), United Nations Statistics Division (UNSD) </p>
SDG_RELATED_INDICATORS__GLOBAL: '<p>15.a.1, 15.b.1 </p>'
