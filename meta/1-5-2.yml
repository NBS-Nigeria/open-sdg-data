STAT_CONC_DEF: >
  Direct economic loss: Direct loss is nearly equivalent to physical damage. The
  monetary value of total or partial destruction of physical assets existing in
  the affected area. Examples include loss to physical assets such as damaged
  housings, factories and infrastructure. Direct losses usually happen during
  the event or within the first few hours after the event and are often assessed
  soon after the event to estimate recovery cost and claim insurance payments.
  These are tangible and relatively easy to measure. Direct Economic loss in
  this indicator framework consists of agriculture loss, damage to industrial
  and commercial facilities, damage to housings and critical infrastructures.   
