SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 5.2.1: Proportion of ever-partnered women and girls aged 15 years
  and older subjected to physical, sexual or psychological violence by a current
  or former intimate partner in the previous 12 months, by form of violence and
  by age</p>
