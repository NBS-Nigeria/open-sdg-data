STAT_CONC_DEF: >
  This indicator seeks to measure the extent to which, and the ways in which,
  transparent, developing country-led results frameworks (CRFs) are used by all
  concerned development partners to plan development cooperation efforts and
  assess their performance. Specifically, the indicator assesses the degree to
  which providers of development cooperation (i.e. development partners) design
  their interventions by relying on objectives and results indicators that are
  drawn from developing country government-led results frameworks reflecting the
  Country's development priorities and goals.
