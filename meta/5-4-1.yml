STAT_CONC_DEF: >-
  Unpaid domestic and care work activities include the unpaid production of
  goods for own final consumption, these include: (a) Unpaid work that involves
  the production of goods for self-consumption (e.g. collecting water or
  firewood);   (b) Unpaid work that involves the provision of services for
  self-consumption (e.g. cooking or cleaning as well as person-to-person care
  for other people); and    (c) 'Voluntary work' which consists of service or
  activity undertaken without pay for the benefit of the community, the
  environment, and persons other than close relatives or those within the
  household.
