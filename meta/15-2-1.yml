STAT_CONC_DEF: >
  “Sustainable forest management” is a central concept for Goal 15 and target
  15.1 as well as for target 15.2.  It has been formally defined, by the UN
  General Assembly, as follows: [a] dynamic and evolving concept [that] aims to
  maintain and enhance the economic, social and environmental values of all
  types of forests, for the benefit of present and future generations”. 
