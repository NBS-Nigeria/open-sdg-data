SDG_INDICATOR__GLOBAL: '<p>Indicator 15.5.1: Red List Index</p>'
SDG_TARGET__GLOBAL: >-
  <p>Target 15.5: Take urgent and significant action to reduce the degradation
  of natural habitats, halt the loss of biodiversity and, by 2020, protect and
  prevent the extinction of threatened species</p>
META_LAST_UPDATE__GLOBAL: '2022-12-16'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>International Union for Conservation of Nature (IUCN)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>Disaggregations of the Red List Index are also of particular relevance as
  indicators towards the following SDG targets (Brooks et al. 2015): SDG 2.4 Red
  List Index (species used for food and medicine); SDG 2.5 Red List Index (wild
  relatives and local breeds); SDG 12.2 Red List Index (impacts of utilisation)
  (Butchart 2008); SDG 12.4 Red List Index (impacts of pollution); SDG 13.1 Red
  List Index (impacts of climate change); SDG 14.1 Red List Index (impacts of
  pollution on marine species); SDG 14.2 Red List Index (marine species); SDG
  14.3 Red List Index (reef-building coral species) (Carpenter et al. 2008); SDG
  14.4 Red List Index (impacts of utilisation on marine species); SDG 15.1 Red
  List Index (terrestrial &amp; freshwater species); SDG 15.2 Red List Index
  (forest-specialist species); SDG 15.4 Red List Index (mountain species); SDG
  15.7 Red List Index (impacts of utilisation) (Butchart 2008); and SDG 15.8 Red
  List Index (impacts of invasive alien species) (Butchart 2008, McGeoch et al.
  2010).</p>
