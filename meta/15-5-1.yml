STAT_CONC_DEF: >
  The Red List Index is a multi-purpose indicator which measures the aggregate
  change in extinction risk across groups of species. It is based on the number
  of species in each category of extinction risk on The IUCN Red List of
  Threatened Species. This indicator is expressed as an index ranging from 0 to
  1.
