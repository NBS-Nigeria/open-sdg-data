SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 15.8.1: Proportion of countries adopting relevant national
  legislation and adequately resourcing the prevention or control of invasive
  alien species</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 15.8: By 2020, introduce measures to prevent the introduction and
  significantly reduce the impact of invasive alien species on land and water
  ecosystems and control or eradicate the priority species</p>
