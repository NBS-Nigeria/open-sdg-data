SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 5.3.2 Proportion of girls and women aged 15&#x2013;49 years who
  have undergone female genital mutilation, by age</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 5.3: Eliminate all harmful practices, such as child, early and
  forced marriage and female genital mutilation</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>United Nations Children&apos;s Fund (UNICEF)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>The prevalence of female genital mutilation can be interpreted alongside
  other indicators about women&#x2019;s well-being, including those on
  women&#x2019;s health under Goal 3, those on the status of women under Goal 5,
  and those around violence against women under Goal 16. </p>
SDG_INDICATOR_INFO: >
  <b>Proxy: </b> MICS - Percentage of women age 15-49 years who report to have
  undergone any form of female genital mutilation (FGM), NDHS - Percentage of
  women age 15-49 who have been circumcised, and percent distribution of
  circumcised women by type of circumcision, according to background
  characteristics
