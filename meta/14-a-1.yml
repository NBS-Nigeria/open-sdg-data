SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 14.a.1: Proportion of total research budget allocated to research
  in the field of marine technology</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 14.a: Increase scientific knowledge, develop research capacity and
  transfer marine technology, taking into account the Intergovernmental
  Oceanographic Commission Criteria and Guidelines on the Transfer of Marine
  Technology, in order to improve ocean health and to enhance the contribution
  of marine biodiversity to the development of developing countries, in
  particular small island developing States and least developed countries</p>
META_LAST_UPDATE__GLOBAL: '2024-08-02'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>Intergovernmental Oceanographic Commission of UNESCO (IOC-UNESCO)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>Links to SDG 17, SDG 5.</p>

  <p>Targets: to all other SDG 14 targets, as science is crucial to protect and
  conserve the oceans&#x2019; resources.</p>
