SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 15.3.1: Proportion of land that is degraded over total land
  area</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 15.3: By 2030, combat desertification, restore degraded land and
  soil, including land affected by desertification, drought and floods, and
  strive to achieve a land degradation-neutral world</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: >-
  <p>United Nations Convention to Combat Desertification (UNCCD) and partners,
  including: Conservation International (CI), European Space Agency (ESA), Food
  and Agriculture Organization of the United Nations (FAO), Group on Earth
  Observation Land Degradation Neutrality Initiative (GEO-LDN), International
  Soil Reference and Information Centre (ISRIC), International Union for
  Conservation of Nature (IUCN), Joint Research Centre of the European
  Commission (JRC), United Nations Statistics Division (UNSD), United Nations
  Development Programme (UNDP), United Nations Environment (UNEP), World
  Resources Institute (WRI), United Nations Framework Convention on Climate
  Change (UNFCCC) and Convention on Biological Diversity (CBD).</p>
SDG_RELATED_INDICATORS__GLOBAL: <p>2.4.1; 6.6.1; 11.3.1; 15.1.1; 15.2.1</p>
