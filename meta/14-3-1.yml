SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 14.3.1: Average marine acidity (pH) measured at agreed suite of
  representative sampling stations</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 14.3: Minimize and address the impacts of ocean acidification,
  including through enhanced scientific cooperation at all levels</p>
META_LAST_UPDATE__GLOBAL: '2023-12-15'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>Intergovernmental Oceanographic Commission (IOC) of UNESCO</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>14.a.1 Increase scientific knowledge, develop research capacity and
  transfer marine technology, taking into account the Intergovernmental
  Oceanographic Commission Criteria and Guidelines on the Transfer of Marine
  Technology, in order to improve ocean health and to enhance the contribution
  of marine biodiversity to the development of developing countries, in
  particular small island developing States and least developed countries</p>
