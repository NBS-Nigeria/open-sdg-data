SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 2.2.3: Prevalence of anaemia in women aged 15 to 49 years, by
  pregnancy status (percentage)</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 2.2: By 2030, end all forms of malnutrition, including achieving, by
  2025, the internationally agreed targets on stunting and wasting in children
  under 5 years of age, and address the nutritional needs of adolescent girls,
  pregnant and lactating women and older persons</p>
META_LAST_UPDATE__GLOBAL: '2024-07-29'
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>World Health Organization (WHO)</p>
SDG_RELATED_INDICATORS__GLOBAL: >-
  <p>Anaemia is estimated to contribute to 17% lower productivity in heavy
  manual labour and 5% lower productivity in other manual labour (Goal 1 End
  poverty in all its forms everywhere); during pregnancy, it increases the risk
  of maternal and perinatal mortality and contributes to low birth-weight
  infants (Goal 3. Good health and well-being); it also limits cognitive
  development, children who have adequate iron have more energy to participate
  in classroom exercises, and they are more mentally prepared to master the
  material (Goal 4. Quality education); anaemia rates in females are much higher
  than males &#x2014; while anaemia rates decrease for males by the end of
  puberty, they remain high for females through reproductive years due to
  menstruation, thus reducing anaemia contributes to boosting females&#x2019;
  relative academic performance and worker productivity and helps achieve gender
  equality (Goal 5. Gender equality).</p>
