STAT_CONC_DEF: >
  Sexual violence is defined as harmful or unwanted sexual behavior that is
  imposed on someone. It includes acts of abusive sexual contact, forced
  engagement in sexual acts, attempted or completed sexual acts without consent,
  incest, sexual harassment, etc. However, in most surveys that collect data on
  sexual violence against women by non partners, the information collected is
  limited to forcing someone into sexual intercourse when she does want to, as
  well as attempting to force someone to perform a sexual act against her will
  or attempting to force her into sexual intercourse.
